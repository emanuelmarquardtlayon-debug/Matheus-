<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="estile.css">
</head>
<body>

    <div class="cadastro-container">
        <div class="cabecalho-pagina">
            <h2>Criar Conta</h2>
            <div class="menu-dono">
                <button id="botaoMenuDono" class="botao-menu-dono" type="button" aria-label="Abrir opções" aria-expanded="false" aria-controls="opcoesDono">
                    <span aria-hidden="true"><i></i><i></i><i></i></span>
                </button>
                <div id="opcoesDono" class="opcoes-dono" hidden>
                    <button id="abrirAcessoDono" class="opcao-menu-dono" type="button">Entrar como dono</button>
                </div>
            </div>
        </div>
        <form id="formCadastro">
            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="input-group">
                <label for="dataNascimento">Data de Nascimento</label>
                <input type="text" id="dataNascimento" required inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" title="Digite a data no formato dd/mm/aaaa">
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Sua senha">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="maiorIdade" required>
                <label for="maiorIdade">Declaro que sou maior de 18 anos</label>
            </div>

            <button type="submit" class="btn-submit">Cadastrar</button>

            <p id="mensagemErro" class="mensagem-erro"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById('formCadastro');
        const nome = document.getElementById('nome');
        const email = document.getElementById('email');
        const dataNascimento = document.getElementById('dataNascimento');
        const mensagemErro = document.getElementById('mensagemErro');
        const botaoCadastro = form.querySelector('button[type="submit"]');
        const menuDono = document.querySelector('.menu-dono');
        const botaoMenuDono = document.getElementById('botaoMenuDono');
        const opcoesDono = document.getElementById('opcoesDono');

        botaoMenuDono.addEventListener('click', function() {
            const aberto = botaoMenuDono.getAttribute('aria-expanded') === 'true';
            botaoMenuDono.setAttribute('aria-expanded', String(!aberto));
            opcoesDono.hidden = aberto;
        });

        document.getElementById('abrirAcessoDono').addEventListener('click', function() {
            window.location.href = 'dono.html';
        });

        document.addEventListener('click', function(event) {
            if (!menuDono.contains(event.target)) {
                opcoesDono.hidden = true;
                botaoMenuDono.setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                opcoesDono.hidden = true;
                botaoMenuDono.setAttribute('aria-expanded', 'false');
            }
        });

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // Impede o recarregamento padrão da página
            mensagemErro.textContent = '';

            const partesData = dataNascimento.value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (!partesData) {
                mensagemErro.textContent = 'Digite a data no formato dia/mês/ano, por exemplo 25/12/2000.';
                return;
            }

            const dia = Number(partesData[1]);
            const mesNascimento = Number(partesData[2]);
            const ano = Number(partesData[3]);
            const dataNasc = new Date(ano, mesNascimento - 1, dia);
            if (dataNasc.getFullYear() !== ano || dataNasc.getMonth() !== mesNascimento - 1 || dataNasc.getDate() !== dia) {
                mensagemErro.textContent = 'Digite uma data de nascimento válida.';
                return;
            }

            const hoje = new Date();
            
            // Calcula a idade
            let idade = hoje.getFullYear() - dataNasc.getFullYear();
            const mes = hoje.getMonth() - dataNasc.getMonth();
            
            if (mes < 0 || (mes === 0 && hoje.getDate() < dataNasc.getDate())) {
                idade--;
            }

            // Valida idade mínima de 18 anos
            if (idade < 18) {
                mensagemErro.textContent = 'É necessário ter no mínimo 18 anos para se cadastrar.';
                return;
            }

            botaoCadastro.disabled = true;
            botaoCadastro.textContent = 'Salvando...';

            try {
                const respostaFirebase = await fetch(
                    'https://matheus-5ad92-default-rtdb.firebaseio.com/cadastros.json',
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            nome: nome.value.trim(),
                            email: email.value.trim(),
                            dataNascimento: dataNascimento.value,
                            confirmouMaioridade: true,
                            dataCadastro: new Date().toISOString()
                        })
                    }
                );

                if (!respostaFirebase.ok) {
                    throw new Error(`Firebase respondeu com status ${respostaFirebase.status}`);
                }

                window.location.href = 'index..html';
            } catch (erro) {
                mensagemErro.textContent = 'Não foi possível salvar o cadastro. Verifique a conexão e as regras de gravação do Firebase.';
                botaoCadastro.disabled = false;
                botaoCadastro.textContent = 'Cadastrar';
            }
        });
    </script>
</body>
</html>
